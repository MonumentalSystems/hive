<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="honey" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#ffd87a"/>
      <stop offset="55%" stop-color="#f5b733"/>
      <stop offset="100%" stop-color="#7a4d0a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe39a"/>
      <stop offset="100%" stop-color="#b97a16"/>
    </linearGradient>
  </defs>
  <!-- main hexagon -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
           fill="url(#honey)" stroke="url(#rim)" stroke-width="2"/>
  <!-- inner honeycomb cells -->
  <g fill="#1a1208" opacity="0.55">
    <polygon points="32,18 41,23.5 41,34.5 32,40 23,34.5 23,23.5"/>
  </g>
  <g fill="none" stroke="#1a1208" stroke-width="1.2" opacity="0.6">
    <polygon points="20,12 28,12 32,18 28,24 20,24 16,18"/>
    <polygon points="36,12 44,12 48,18 44,24 36,24 32,18"/>
    <polygon points="20,40 28,40 32,46 28,52 20,52 16,46"/>
    <polygon points="36,40 44,40 48,46 44,52 36,52 32,46"/>
  </g>
</svg>
