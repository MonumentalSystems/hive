swagger: '2.0'

info:
    title: HiveTalk Vanilla API
    description: API description for external applications that integrate with HiveTalk Vanilla.
    version: 1.0.1

basePath: /api/v1

schemes:
    - https
    - http

paths:
    /meetinfo:
        get:
            tags:
                - 'meeting info'
            summary: 'Get meeting info'
            description: 'Get meeting info'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Get Meeting info'
                    schema:
                        $ref: '#/definitions/MeetingResponse'
                '403':
                    description: 'Unauthorized!'
    /meetings:
        get:
            tags:
                - 'meetings'
            summary: 'Get meetings'
            description: 'Get meetings'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Get Meetings done'
                    schema:
                        $ref: '#/definitions/MeetingsResponse'
                '403':
                    description: 'Unauthorized!'
    /meeting:
        post:
            tags:
                - 'meeting'
            summary: 'Create meeting'
            description: 'Create meeting'
            parameters:
                - in: body
                  name: Meeting
                  description: Custom Meeting URL.
                  schema:
                      $ref: '#/definitions/MeetingRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Meeting created'
                    schema:
                        $ref: '#/definitions/MeetingResponse'
                '403':
                    description: 'Unauthorized!'
    /join:
        post:
            tags:
                - 'join'
            summary: 'Create direct join'
            description: 'Create join'
            parameters:
                - in: body
                  name: Join
                  description: Custom Join URL.
                  schema:
                      $ref: '#/definitions/JoinRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Direct join created'
                    schema:
                        $ref: '#/definitions/JoinResponse'
                '403':
                    description: 'Unauthorized!'
    /token:
        post:
            tags:
                - 'token'
            summary: 'Get token'
            description: 'Get token'
            parameters:
                - in: body
                  name: token
                  description: Custom Token.
                  schema:
                      $ref: '#/definitions/TokenRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Get token done'
                    schema:
                        $ref: '#/definitions/TokenResponse'
                '403':
                    description: 'Unauthorized!'
    /bots:
        post:
            tags:
                - 'bots'
            summary: 'Create native bot participant'
            description: 'Create a trusted server-side bot participant in a room.'
            parameters:
                - in: body
                  name: bot
                  schema:
                      $ref: '#/definitions/BotCreateRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '201':
                    description: 'Bot created'
                    schema:
                        $ref: '#/definitions/BotResponse'
                '403':
                    description: 'Unauthorized!'
    /rooms/{roomId}/bots:
        get:
            tags:
                - 'bots'
            summary: 'List native bot participants'
            parameters:
                - in: path
                  name: roomId
                  required: true
                  type: string
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Bots listed'
    /rooms/{roomId}/bots/{botId}/state:
        post:
            tags:
                - 'bots'
            summary: 'Set native bot state'
            parameters:
                - in: path
                  name: roomId
                  required: true
                  type: string
                - in: path
                  name: botId
                  required: true
                  type: string
                - in: body
                  name: state
                  schema:
                      $ref: '#/definitions/BotStateRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '200':
                    description: 'Bot state updated'
    /rooms/{roomId}/bots/{botId}/producers:
        post:
            tags:
                - 'bots'
            summary: 'Create bot RTP producer'
            description: 'Create a mediasoup PlainTransport producer for generated bot audio or video.'
            parameters:
                - in: path
                  name: roomId
                  required: true
                  type: string
                - in: path
                  name: botId
                  required: true
                  type: string
                - in: body
                  name: producer
                  schema:
                      $ref: '#/definitions/BotProducerRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '201':
                    description: 'Bot producer created'
    /rooms/{roomId}/bots/{botId}/consumers:
        post:
            tags:
                - 'bots'
            summary: 'Attach bot RTP consumer'
            description: 'Create a mediasoup PlainTransport consumer for room audio/video capture.'
            parameters:
                - in: path
                  name: roomId
                  required: true
                  type: string
                - in: path
                  name: botId
                  required: true
                  type: string
                - in: body
                  name: consumer
                  schema:
                      $ref: '#/definitions/BotConsumerRequest'
            consumes:
                - 'application/json'
            produces:
                - 'application/json'
            security:
                - secretApiKey: []
            responses:
                '201':
                    description: 'Bot consumer attached'

securityDefinitions:
    secretApiKey:
        type: 'apiKey'
        name: 'authorization'
        in: 'header'
        description: 'Format like this: authorization: {API_KEY_SECRET}'

definitions:
    MeetingsResponse:
        type: object
        properties:
            meetings:
                type: array
                items:
                    $ref: '#/definitions/Meeting'
    MeetingResponse:
        type: 'object'
        properties:
            meeting:
                type: array
                items:
                    $ref: '#/definitions/Meetinfo'

    MeetingRequest:
        type: object
        properties:
            name:
                type: string
                default: 'hivetalksfu'
                $ref: '#/definitions/MeetingRequest'
    JoinRequest:
        type: object
        properties:
            room:
                type: string
                default: 'test'
            roomPassword:
                type: ['boolean', 'string'] # Allow boolean or string type
                default: false
            name:
                type: string
                default: 'hivetalksfu'
            audio:
                type: boolean
                default: false
            video:
                type: boolean
                default: false
            screen:
                type: boolean
                default: false
            hide:
                type: boolean
                default: false
            notify:
                type: boolean
                default: false
            token:
                $ref: '#/definitions/TokenRequest'
    TokenRequest:
        type: object
        properties:
            username:
                type: string
                default: 'username'
            password:
                type: string
                default: 'password'
            presenter:
                type: boolean
                default: true
            expire:
                type: string
                default: '1h'
    JoinResponse:
        type: 'object'
        properties:
            join:
                type: string
    TokenResponse:
        type: 'object'
        properties:
            token:
                type: string
    BotCreateRequest:
        type: object
        properties:
            roomId:
                type: string
            name:
                type: string
                default: 'HiveVoiceBot'
            controllingNpub:
                type: string
            allowedRoomOwnerNpubs:
                type: array
                items:
                    type: string
            bridge:
                type: object
    BotStateRequest:
        type: object
        properties:
            state:
                type: string
                enum:
                    - listening
                    - thinking
                    - speaking
                    - idle
                    - error
    BotProducerRequest:
        type: object
        properties:
            kind:
                type: string
                enum:
                    - audio
                    - video
            mediaType:
                type: string
            transport:
                type: object
            rtpParameters:
                type: object
    BotConsumerRequest:
        type: object
        properties:
            producerId:
                type: string
            transport:
                type: object
            rtpCapabilities:
                type: object
    BotResponse:
        type: object
        properties:
            room:
                type: string
            bot:
                type: object
    Peer:
        type: object
        properties:
            name:
                type: string
            presenter:
                type: boolean
            npub:
                type: string
            pubkey:
                type: string
            lnaddress:
                type: string
            bot:
                type: boolean
            botState:
                type: string
    Meeting:
        type: object
        properties:
            roomId:
                type: string
            peers:
                type: array
                items:
                    $ref: '#/definitions/Peer'
    Meetinfo:
        type: object
        properties:
            roomId:
                type: string
            peers:
                type: string
